[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-research-assistant"
version = "0.1.0"
description = "Production-style RAG assistant for research and technical documents."
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.0",
    "pypdf>=5.0",
    "sentence-transformers>=3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100